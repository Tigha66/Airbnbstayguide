<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F766E">
<title>You're offline · StayGuide</title>
<link rel="icon" href="/icon.svg">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f8f9f5;color:#111;padding:24px}
  main{max-width:420px;width:100%;text-align:center}
  img{width:56px;height:56px}
  h1{font-size:24px;margin:16px 0 8px}
  p{color:#555;line-height:1.5;margin:0 0 20px}
  button,a.guide{display:block;width:100%;padding:14px 16px;border-radius:12px;font-size:16px;
    font-weight:600;text-decoration:none;border:0;cursor:pointer}
  button{background:#0F766E;color:#fff}
  #guides{margin-top:24px;text-align:left}
  #guides h2{font-size:15px;color:#555;margin:0 0 8px}
  a.guide{background:#fff;color:#0F766E;border:1px solid #d8ded6;margin-bottom:8px}
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="StayGuide">
  <h1 id="title">You're offline</h1>
  <p id="body">This page hasn't been saved on this phone yet. Connect to Wi-Fi or mobile data and try again.</p>
  <button id="retry" type="button" onclick="location.reload()">Try again</button>
  <div id="guides" hidden>
    <h2 id="saved">Guides saved on this phone</h2>
    <div id="list"></div>
  </div>
</main>
<script>
(function () {
  var t = {
    fr: ["Vous êtes hors ligne", "Cette page n'est pas encore enregistrée sur ce téléphone. Connectez-vous au Wi-Fi ou aux données mobiles et réessayez.", "Réessayer", "Guides enregistrés sur ce téléphone"],
    es: ["Estás sin conexión", "Esta página aún no está guardada en este teléfono. Conéctate al Wi-Fi o a los datos móviles e inténtalo de nuevo.", "Reintentar", "Guías guardadas en este teléfono"],
    de: ["Sie sind offline", "Diese Seite ist auf diesem Telefon noch nicht gespeichert. Verbinden Sie sich mit WLAN oder mobilen Daten und versuchen Sie es erneut.", "Erneut versuchen", "Auf diesem Telefon gespeicherte Gästemappen"],
    ar: ["أنت غير متصل بالإنترنت", "لم يتم حفظ هذه الصفحة على هذا الهاتف بعد. اتصل بشبكة Wi-Fi أو بيانات الجوال وحاول مرة أخرى.", "حاول مرة أخرى", "الأدلة المحفوظة على هذا الهاتف"]
  };
  var lang = "en";
  try { lang = localStorage.getItem("stayguide-language") || navigator.language.split("-")[0]; } catch (e) {}
  var s = t[lang];
  if (s) {
    document.documentElement.lang = lang;
    if (lang === "ar") document.documentElement.dir = "rtl";
    document.getElementById("title").textContent = s[0];
    document.getElementById("body").textContent = s[1];
    document.getElementById("retry").textContent = s[2];
    document.getElementById("saved").textContent = s[3];
  }
  window.addEventListener("online", function () { location.reload(); });
  // Offer the guest guides already saved on this phone.
  if (!("caches" in window)) return;
  caches.open("stayguide-public-guides-v1").then(function (cache) {
    return cache.keys();
  }).then(function (requests) {
    var list = document.getElementById("list");
    var seen = {};
    requests.forEach(function (request) {
      var path = new URL(request.url).pathname;
      if (seen[path] || !/^\/g\/[^/]+$/.test(path)) return;
      seen[path] = true;
      var link = document.createElement("a");
      link.className = "guide";
      link.href = path;
      var slug = decodeURIComponent(path.slice(3)).replace(/-/g, " ");
      link.textContent = slug.charAt(0).toUpperCase() + slug.slice(1);
      list.appendChild(link);
    });
    if (list.children.length) document.getElementById("guides").hidden = false;
  }).catch(function () {});
})();
</script>
</body>
</html>
