name: StayGuide release candidate checks
on:
  push:
    branches:
      - feature/stayguide-release-ci-20261025
      - agent/paid-self-service-20261025
  pull_request:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.32.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies (no live provider scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test account, tenancy, billing, and paid extras logic
        run: pnpm --filter @stayguide/web test
      - name: Lint
        run: pnpm --filter @stayguide/web lint
      - name: Type checking
        run: pnpm --filter @stayguide/web typecheck
      - name: Build without external accounts or migrations
        run: pnpm --filter @stayguide/web build
      - name: Install Chromium for isolated browser acceptance
        run: pnpm --filter @stayguide/web exec playwright install --with-deps chromium
      - name: Test host, guest, mobile, payment receipts and offline recovery
        run: pnpm --filter @stayguide/web test:e2e
