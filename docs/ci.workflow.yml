# Copy this file to .github/workflows/ci.yml from the GitHub website (Add file → Create new file).
# It can't be committed there by the coding agent: its GitHub app lacks the "workflow" permission,
# and a push containing .github/workflows/* is rejected as a whole.
name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
