<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>You're offline · StayGuide</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Crect width=%22512%22 height=%22512%22 rx=%22112%22 fill=%22%230F766E%22/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f8f9f5;color:#111;
    padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}
  main{max-width:420px;width:100%;text-align:center}
  .logo{width:56px;height:56px;display:block;margin:0 auto}
  h1{font-size:24px;margin:16px 0 8px}
  p{color:#555;line-height:1.5;margin:0 0 20px}
  button,a.button,a.page{display:block;width:100%;padding:14px 16px;border-radius:12px;font-size:16px;
    font-weight:600;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
  .primary{background:#0F766E;color:#fff}
  .secondary{background:#fff;color:#0F766E;border:1px solid #d8ded6;margin-top:10px}
  section{margin-top:24px;text-align:left}
  section h2{font-size:15px;color:#555;margin:0 0 8px}
  a.page{background:#fff;color:#0F766E;border:1px solid #d8ded6;margin-bottom:8px}
</style>
</head>
<body>
<main>
  <svg class="logo" role="img" aria-label="StayGuide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0F766E"/><path d="M136 151c55-15 91-2 120 25 29-27 65-40 120-25v200c-55-15-91-2-120 25-29-27-65-40-120-25z" fill="none" stroke="#f6f7eb" stroke-width="19" stroke-linejoin="round"/><path d="M256 177v198" fill="none" stroke="#f6f7eb" stroke-width="16"/><circle cx="371" cy="124" r="22" fill="#d9ddb2"/></svg>
  <h1 id="title">You're offline</h1>
  <p id="body">This page hasn't been saved on this phone yet. Connect to Wi-Fi or mobile data and try again.</p>
  <button id="retry" class="primary" type="button" onclick="location.reload()">Try again</button>
  <a id="home" class="button secondary" href="/">Back to home</a>
  <section id="pages" hidden>
    <h2 id="pages-title">Saved on this phone</h2>
    <div id="page-list"></div>
  </section>
  <section id="guides" hidden>
    <h2 id="saved">Guides saved on this phone</h2>
    <div id="list"></div>
  </section>
</main>
<script>
(function () {
  // [title, not-saved message, try again, guides heading, back to home, pages heading, needs-internet message, Home, Pricing, Guest demo]
  var t = {
    en: ["You're offline", "This page hasn't been saved on this phone yet. Connect to Wi-Fi or mobile data and try again.", "Try again", "Guides saved on this phone", "Back to home", "Saved on this phone", "Logging in and your dashboard need an internet connection. Connect to Wi-Fi or mobile data and try again.", "Home", "Pricing", "Guest demo"],
    fr: ["Vous êtes hors ligne", "Cette page n'est pas encore enregistrée sur ce téléphone. Connectez-vous au Wi-Fi ou aux données mobiles et réessayez.", "Réessayer", "Guides enregistrés sur ce téléphone", "Retour à l'accueil", "Enregistré sur ce téléphone", "La connexion et votre tableau de bord nécessitent Internet. Connectez-vous au Wi-Fi ou aux données mobiles et réessayez.", "Accueil", "Tarifs", "Démo voyageur"],
    es: ["Estás sin conexión", "Esta página aún no está guardada en este teléfono. Conéctate al Wi-Fi o a los datos móviles e inténtalo de nuevo.", "Reintentar", "Guías guardadas en este teléfono", "Volver al inicio", "Guardado en este teléfono", "Para iniciar sesión y usar tu panel necesitas conexión a Internet. Conéctate al Wi-Fi o a los datos móviles e inténtalo de nuevo.", "Inicio", "Precios", "Demo para huéspedes"],
    de: ["Sie sind offline", "Diese Seite ist auf diesem Telefon noch nicht gespeichert. Verbinden Sie sich mit WLAN oder mobilen Daten und versuchen Sie es erneut.", "Erneut versuchen", "Auf diesem Telefon gespeicherte Gästemappen", "Zur Startseite", "Auf diesem Telefon gespeichert", "Anmeldung und Dashboard brauchen eine Internetverbindung. Verbinden Sie sich mit WLAN oder mobilen Daten und versuchen Sie es erneut.", "Startseite", "Preise", "Gäste-Demo"],
    ar: ["أنت غير متصل بالإنترنت", "لم يتم حفظ هذه الصفحة على هذا الهاتف بعد. اتصل بشبكة Wi-Fi أو بيانات الجوال وحاول مرة أخرى.", "حاول مرة أخرى", "الأدلة المحفوظة على هذا الهاتف", "العودة إلى الصفحة الرئيسية", "محفوظ على هذا الهاتف", "يتطلب تسجيل الدخول ولوحة التحكم اتصالاً بالإنترنت. اتصل بشبكة Wi-Fi أو بيانات الجوال وحاول مرة أخرى.", "الرئيسية", "الأسعار", "تجربة الضيف"]
  };
  var lang = "en";
  try { lang = localStorage.getItem("stayguide-language") || navigator.language.split("-")[0]; } catch (e) {}
  if (!t[lang]) lang = "en";
  var s = t[lang];
  document.documentElement.lang = lang;
  if (lang === "ar") document.documentElement.dir = "rtl";
  function set(id, text) { document.getElementById(id).textContent = text; }
  set("title", s[0]);
  set("retry", s[2]);
  set("saved", s[3]);
  set("home", s[4]);
  set("pages-title", s[5]);
  // Login, dashboard and admin are never saved: say they need internet rather than "not saved yet".
  var onlineOnly = /^\/(login|dashboard|admin|status)(\/|$)/.test(location.pathname);
  set("body", onlineOnly ? s[6] : s[1]);
  // The home page link opens the saved home page in the visitor's language.
  var base = lang === "en" ? "" : "/" + lang;

  // When the connection comes back, retry this page, but never while the guest is
  // already opening something else (browsers can fire "online" mid-navigation,
  // and reloading then would pull them back to this screen).
  var leaving = false;
  window.addEventListener("beforeunload", function () { leaving = true; });
  window.addEventListener("pagehide", function () { leaving = true; });
  document.addEventListener("click", function (e) {
    if (e.target && e.target.closest && e.target.closest("a")) leaving = true;
  });
  window.addEventListener("online", function () {
    setTimeout(function () {
      if (!leaving && navigator.onLine && document.visibilityState === "visible") location.reload();
    }, 1500);
  });

  if (!("caches" in window)) return;
  function addLink(listId, sectionId, href, text) {
    var link = document.createElement("a");
    link.className = "page";
    link.href = href;
    link.textContent = text;
    document.getElementById(listId).appendChild(link);
    document.getElementById(sectionId).hidden = false;
  }

  // Website pages saved on this phone (home, pricing, demo), in the visitor's language when saved.
  caches.open("stayguide-site-pages-v1").then(function (cache) {
    return cache.keys().then(function (requests) {
      var saved = {};
      requests.forEach(function (r) { saved[new URL(r.url).pathname] = true; });
      var pages = [
        [[base || "/", "/"], s[7]],
        [[base + "/pricing", "/pricing"], s[8]],
        [["/demo"], s[9]]
      ];
      pages.forEach(function (page) {
        for (var i = 0; i < page[0].length; i++)
          if (saved[page[0][i]] && page[0][i] !== location.pathname) return addLink("page-list", "pages", page[0][i], page[1]);
      });
    });
  }).catch(function () {});

  // Name each guide from the title saved with it ("Casa Serena — Your guest guide").
  function guideName(cache, request, path) {
    var slug = decodeURIComponent(path.slice(3)).replace(/-/g, " ");
    var fallback = slug.charAt(0).toUpperCase() + slug.slice(1);
    return cache.match(request, { ignoreVary: true }).then(function (response) {
      return response ? response.text() : "";
    }).then(function (html) {
      var m = /<title>([^<]*)<\/title>/i.exec(html);
      if (!m) return fallback;
      var el = document.createElement("textarea");
      el.innerHTML = m[1];
      return el.value.split(" — ")[0].trim() || fallback;
    }).catch(function () { return fallback; });
  }
  caches.open("stayguide-public-guides-v1").then(function (cache) {
    return cache.keys().then(function (requests) {
      var seen = {};
      var found = [];
      requests.forEach(function (request) {
        var path = new URL(request.url).pathname;
        if (seen[path] || !/^\/g\/[^/]+$/.test(path)) return;
        seen[path] = true;
        found.push(guideName(cache, request, path).then(function (name) { return [path, name]; }));
      });
      return Promise.all(found);
    });
  }).then(function (guides) {
    guides.forEach(function (guide) { addLink("list", "guides", guide[0], guide[1]); });
  }).catch(function () {});
})();
</script>
</body>
</html>
